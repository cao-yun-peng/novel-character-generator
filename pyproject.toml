[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-character-generator"
version = "0.1.0"
description = "Evidence-first semantic pipeline for novel character visual facts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novel_character_generator"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
