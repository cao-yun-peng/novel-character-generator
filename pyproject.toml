[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-character-generator"
version = "0.1.0.dev33"
description = "Grounded character mention discovery for Chinese novels"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10", "jsonschema>=4.26,<5", "httpx>=0.27,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
novel-character-generator = "novel_character_generator.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
