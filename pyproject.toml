[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-character-generator"
version = "0.1.0"
description = "小说角色提取与图像生成垂直切片"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
novel-api = "novel_character_generator.api.app:run"
novel-worker = "novel_character_generator.workers.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_character_generator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["novel_character_generator"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
